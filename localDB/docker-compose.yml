services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: metro
      POSTGRES_DB: metro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metro"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
