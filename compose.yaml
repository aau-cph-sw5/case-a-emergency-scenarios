services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metro
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metro"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - metro_postgres_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro

  flyway:
    image: flyway/flyway:13.9.0
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - ./src/db:/flyway/project:ro
    entrypoint:
      [
        "flyway",
        "-workingDirectory=/flyway/project",
        "-configFiles=/flyway/project/flyway.toml",
      ]
    command: ["migrate"]

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metro_test
      POSTGRES_USER: metro
      # Test data is disposable and this service listens only on localhost.
      POSTGRES_PASSWORD: metro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metro_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - metro_test_postgres_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro

  flyway-test:
    image: flyway/flyway:13.9.0
    profiles: ["tools"]
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./src/db:/flyway/project:ro
    entrypoint:
      [
        "flyway",
        "-workingDirectory=/flyway/project",
        "-configFiles=/flyway/project/flyway.test.toml",
      ]
    command: ["migrate"]

volumes:
  metro_postgres_data:
  metro_test_postgres_data:
