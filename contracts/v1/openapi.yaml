openapi: 3.1.0

info:
  title: Emergency Scenario State API
  version: 1.0.0
  description: >
    Shared scenario-state contract used by the control-room
    and steward clients.

servers:
  - url: http://localhost:4010

paths:
  /api/v1/scenario-state:
    get:
      summary: Get current scenario state
      responses:
        "200":
          description: Current scenario state
          content:
            application/json:
              schema:
                $ref: "./scenario-state.schema.json"

  /api/v1/scenarios:
    get:
      summary: Get all scenarios
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./scenario.schema.json"

  /api/v1/scenarios/{scenarioId}:
    get:
      summary: Get a single scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "./scenario.schema.json"
        "404":
          description: Scenario not found

  /api/v1/metro-lines/{lineId}:
    get:
      summary: Get metro line by ID
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metro line details
          content:
            application/json:
              schema:
                $ref: "./metro-line.schema.json"

  /api/v1/position-reports:
    post:
      summary: Report a steward position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./position-report.schema.json"
            example:
              staff: "steward-002"
              station: "Station B"
              reportedAt: "2026-09-23T08:10:00Z"

      responses:
        "202":
          description: Position report accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                properties:
                  accepted:
                    type: boolean
              example:
                accepted: true

  /api/v1/auth/login:
    post:
      summary: Sign in and receive a role-bound token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./login-request.schema.json"
            example:
              username: "steward-test"
              password: "steward-test-pw"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "./login-response.schema.json"
        "401":
          description: Invalid credentials

  /api/v1/me:
    get:
      summary: Get the signed-in user's identity and role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "./me.schema.json"
        "401":
          description: Missing or invalid token

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
