openapi: 3.1.0

info:
  title: Emergency Scenario State API
  version: 8.3.0
  description: >
    Shared scenario-state contract used by the control-room
    and steward clients.

servers:
  - url: http://localhost:4010

paths:
  /api/v1/scenario-state:
    get:
      summary: Get current scenario state
      description: >
        Returns the active activation in the user's own line group, the
        same one GET /api/v1/activations lists as ACTIVE. Answers 200 with
        null while no scenario is active in that line group.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current scenario state, or null while no scenario is active
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "./scenario-state.schema.json"
                  - type: "null"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/scenarios:
    get:
      summary: Get all scenarios of the user's line group
      description: >
        Returns the scenarios in the signed-in user's own line group
        (M1/M2 or M3/M4). Another line group's scenarios are not listed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./scenario.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/scenarios/{scenarioId}:
    get:
      summary: Get a single scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
        - name: activationId
          in: query
          required: false
          description: Return the version captured by this active activation; answers 404 if it is not active or belongs to another scenario.
          schema:
            type: integer
            minimum: 1
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "./scenario.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "404":
          description: Scenario not found, or it belongs to another line group

  /api/v1/metro-lines/{lineId}:
    get:
      summary: Get metro line by ID
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metro line details
          content:
            application/json:
              schema:
                $ref: "./metro-line.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "404":
          description: Metro line not found

  /api/v1/position-reports:
    post:
      summary: Report a steward position
      description: >
        Requires a bearer token with the STEWARD role. The reported station
        must require manning in an active scenario. The staff and
        reportedAt fields are required by the schema but replaced by the
        server: staff by the userId from the token, reportedAt by the time
        the server accepted the report. An accepted report is forwarded to
        connected operators as the position-report Socket.IO event.
        With taskDone true the steward reports the task at the station as
        done (MET-A-015). That is only allowed at the station of the
        steward's latest report (E1006 otherwise), and sending it again is
        a harmless repeat.
        The optional event says what the report means (MET-A-015):
        EN_ROUTE (the default) is on the way, ARRIVED is arrived,
        CANCELLED withdraws being on the way and frees the station, and
        CHECKED_OUT is leaving the station after arriving. ARRIVED and
        CANCELLED are only allowed after EN_ROUTE, and CHECKED_OUT only
        after ARRIVED or taskDone, all at the station of the steward's
        latest report (E1006 otherwise). event and taskDone cannot be sent
        together (E0006). EN_ROUTE at the station of the latest report, while
        on the way or arrived there, is a harmless repeat, so a report
        without event never moves an arrived steward back to on the way.
        EN_ROUTE to another station while on the way frees the old station,
        as with CANCELLED. After arriving or task done it is rejected with
        E1006: the steward checks out first.
        An optional client-generated id (UUID) identifies the original action
        across offline retries (MET-A-006). Repeating an accepted request with
        the same id and original action data returns 202 without creating
        another report, incident-log event or operator notification.
        Reusing an id for different action data returns 409 E0007.
        A previously accepted report can be acknowledged after stand-down.
        Reports without an id remain supported for older clients.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./position-report.schema.json"
            example:
              id: "8e20fa9a-8456-42f4-869c-14cc06a8770a"
              activationId: 1
              staff: "steward-002"
              station: "Station B"
              reportedAt: "2026-09-23T08:10:00Z"
              event: "EN_ROUTE"

      responses:
        "202":
          description: Position report accepted including an identical previously accepted retry
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                properties:
                  accepted:
                    type: boolean
              example:
                accepted: true
        "400":
          description: Request body does not match the position-report contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0006"
                  message: "Request body does not match contract schema"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "403":
          description: The signed-in role may not report a position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0002"
                  message: "The authenticated user's role does not permit this action"
        "409":
          description: >
            No scenario is active (E1001), the report was made against an
            activation that is no longer active, for example because the
            scenario changed while the steward was offline (E1003), the
            station does not require manning in that activation (E1004), or task done or the event
            is not allowed from the steward's current status (E1006), for
            example EN_ROUTE to another station after arriving, before
            checking out. A client report ID reused for different action
            data is rejected with E0007.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noActiveScenario:
                  value:
                    error:
                      code: "E1001"
                      message: "No scenario is currently active"
                supersededActivation:
                  value:
                    error:
                      code: "E1003"
                      message: "The scenario has been stood down"
                stationNotInScenario:
                  value:
                    error:
                      code: "E1004"
                      message: "The station is not part of the active scenario"
                taskDoneElsewhere:
                  value:
                    error:
                      code: "E1006"
                      message: "The status change is not permitted from the steward's current status"
                conflictingClientReportId:
                  value:
                    error:
                      code: "E0007"
                      message: "A conflict prevents this action"
  /api/v1/auth/login:
    post:
      summary: Sign in and receive a role-bound token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./login-request.schema.json"
            example:
              username: "steward-test"
              password: "steward-test-pw"
              client: "mobile"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "./login-response.schema.json"
        "400":
          description: Request body does not match the login-request contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0006"
                  message: "Request body does not match contract schema"
        "401":
          description: Invalid credentials or account role for this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0102"
                  message: "Invalid credentials"

  /api/v1/auth/renew:
    post:
      summary: Replace a valid session with a renewed token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session renewed
          content:
            application/json:
              schema:
                $ref: "./login-response.schema.json"
        "204":
          description: Session remains valid but is not due for renewal
        "401":
          description: Missing, invalid, replaced or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/me:
    get:
      summary: Get the signed-in user's identity and role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "./me.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/auth/logout:
    post:
      summary: End the current login session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/activations:
    get:
      summary: List activations
      description: >
        Returns the activations of the user's own line group. Each line
        group can have one active scenario at a time, so the list holds at
        most one ACTIVE entry. Any signed-in role may read it.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Only return activations with this status.
          schema:
            type: string
            enum: [ACTIVE, CLOSED]
      responses:
        "200":
          description: The activations, empty when none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./scenario-state.schema.json"
        "400":
          description: >
            status is not ACTIVE or CLOSED, or is given more than once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0005"
                  message: "status must be one of ACTIVE, CLOSED"

  /api/v1/scenarios/{scenarioId}/activate:
    post:
      summary: Activates a scenario with given id
      description: >
        Requires a bearer token with the OPERATOR role ("All in CCR can
        activate a scenario", Metro on MET-A-026). The actor is taken from
        the token, never from the request.

        To switch scenarios, send replaces with the active activationId:
        the old one is stood down and the new one activated together
        (MET-A-009).

        Each line group (M1/M2, M3/M4) can have one active scenario at a
        time. An operator can only activate or switch to scenarios in their
        own line group; another line group's scenario answers 404.
      security:
        - bearerAuth: []
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./activate-request.schema.json"
            example:
              replaces: 1
      responses:
        "201":
          description: Activation successful
          content:
            application/json:
              schema:
                $ref: "./scenario-state.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "403":
          description: The signed-in role may not activate a scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0002"
                  message: "Role STEWARD may not activate a scenario"
        "404":
          description: Scenario not found, or it belongs to another line group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0004"
                  message: "No scenario with id 'S1' exists"
        "409":
          description: >
            A scenario is active in the line group and replaces was not
            given, or replaces is not the line group's active activation.
            Nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyActive:
                  value:
                    error:
                      code: "E0007"
                      message: "A scenario is already active in this line group, so 'S1' cannot be activated"
                replacesNotActive:
                  value:
                    error:
                      code: "E0007"
                      message: "'1' is not the active activation"

  /api/v1/activations/{activationId}/stand-down:
    post:
      summary: Stands down the active scenario
      description: >
        Requires the OPERATOR role. Sets the activation to CLOSED with
        endedAt and writes a SCENARIO_STOOD_DOWN event (MET-A-009).
        Afterwards no scenario is active in that line group. An operator
        can only stand down their own line group's activation.
      security:
        - bearerAuth: []
      parameters:
        - name: activationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Stood down. The closed activation.
          content:
            application/json:
              schema:
                $ref: "./scenario-state.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "403":
          description: The signed-in role may not stand down a scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0002"
                  message: "Role STEWARD may not stand down a scenario"
        "404":
          description: No activation with this id, or it belongs to another line group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0004"
                  message: "No activation with id '1' exists"
        "409":
          description: The activation is already stood down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E1003"
                  message: "'1' is already stood down"

  /api/v1/station-threads:
    get:
      summary: List the station threads for the operator
      description: >
        Requires the OPERATOR role. Returns the station threads (MET-A-029)
        of the active activation in the operator's own line group, without
        their messages. Only threads with at least one message are listed.
        UNANSWERED threads come first, the one with the oldest
        unansweredSince at the top, then ANSWERED threads with the latest
        lastMessageAt first. Answers 200 with an empty list while the line
        group has no active scenario: no threads is a valid answer for the
        list, while reading or writing one thread then answers 409 E1001.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The threads, empty when there are none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./station-thread.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "403":
          description: The signed-in role may not list the station threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0002"
                  message: "The authenticated user's role does not permit this action"

  /api/v1/station-threads/{station}:
    get:
      summary: Read a station's thread
      description: >
        Returns the thread of the station in the active activation in the
        user's own line group, with its messages in the order the server
        received them (MET-A-029). A thread without messages is returned
        ANSWERED with an empty messages list. Reading changes nothing.

        A STEWARD must be checked in at the station: the steward's latest
        position report in the activation is ARRIVED there. Before
        arriving, after task done and after checking out the answer is
        409 E1007. An OPERATOR can read any station that requires manning
        in the activation, the same stations a position report can be made
        for (E1004 otherwise).

        A steward message is from the station. No response carries the
        identity of the steward who wrote it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Station"
      responses:
        "200":
          description: The thread with its messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./station-thread.schema.json"
                  - required:
                      - messages
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "409":
          description: >
            The user's line group has no active scenario (E1001), the
            station does not require manning in the activation (E1004), or
            the steward is not checked in at the station (E1007), checked
            in that order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noActiveScenario:
                  value:
                    error:
                      code: "E1001"
                      message: "No scenario is currently active"
                stationNotInScenario:
                  value:
                    error:
                      code: "E1004"
                      message: "The station is not part of the active scenario"
                notCheckedIn:
                  value:
                    error:
                      code: "E1007"
                      message: "The steward is not checked in at the station"

  /api/v1/station-threads/{station}/messages:
    post:
      summary: Write a message in a station's thread
      description: >
        A STEWARD checked in (ARRIVED) at the station sends to the control
        room, and an OPERATOR writes to any station that requires manning
        in the active activation of their own line group, as a reply or as
        the first message (MET-A-029). The sender is taken from the role in the token:
        STATION for a steward, CONTROL_ROOM for an operator. The steward's
        identity is not part of the message, and it is not stored with the
        message or written to its incident-log event, so the steward who
        wrote a message cannot be found from it afterwards.

        receivedAt is set by the server and writtenAt is kept as sent. The
        thread state follows the order the server received the messages: a
        steward message makes the thread UNANSWERED and an operator message
        makes it ANSWERED, also when a steward message written earlier
        arrives after a later operator message. An accepted message is
        pushed as the station-message Socket.IO event to the operators in
        the activation's line group and to the stewards checked in at the
        station.

        activationId is the activation the writer saw. If it is not an
        active activation in the user's own line group the answer is 409
        E1003, for example because the scenario was stood down or switched
        while the message waited in an offline queue. E1001 is answered
        only when the id is unknown and the line group has no active
        scenario.

        clientMessageId identifies the message across retries and is
        unique across all messages. Repeating an accepted request with the
        same clientMessageId and content returns 200 with the stored
        message, without storing another message, writing another
        incident-log event or pushing another socket event. The content is
        the same when the station, activationId, text and writtenAt are the
        same; text is stored and compared exactly as sent. Reusing a
        clientMessageId for different content returns 409 E0007.

        The checks are made in this order: the body (400 E0006), a repeat
        (200, or 409 E0007), the activation (E1001 or E1003), the station
        (E1004) and, for a steward, the check-in (E1007). A repeat is
        therefore answered with 200 also after stand-down and after the
        steward has checked out, so a message whose first answer was lost
        is never shown as rejected.

        A 400 or 409 answer is final: the client drops the message and
        tells the user. Everything else is retried: no connection, 5xx
        answers, and 401 once the session is renewed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Station"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./station-message-request.schema.json"
            example:
              clientMessageId: "6f1c2f0e-4a53-4a0e-9d0b-2f8c7c1f5b11"
              activationId: 1
              text: "Elevatoren er ude af drift. Skal vi henvise til trappen?"
              writtenAt: "2026-09-23T08:20:00Z"
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                $ref: "./station-message.schema.json"
        "200":
          description: >
            Repeat of an already stored message with the same
            clientMessageId and content. The stored message.
          content:
            application/json:
              schema:
                $ref: "./station-message.schema.json"
        "400":
          description: Request body does not match the station-message-request contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0006"
                  message: "Request body does not match contract schema"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "409":
          description: >
            activationId is unknown and the line group has no active
            scenario (E1001), the thread is closed because activationId is
            not an active activation (E1003), the station does not require
            manning in the activation (E1004), the
            steward is not checked in at the station (E1007), or
            clientMessageId was already used for different content (E0007).
            Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noActiveScenario:
                  value:
                    error:
                      code: "E1001"
                      message: "No scenario is currently active"
                threadClosed:
                  value:
                    error:
                      code: "E1003"
                      message: "The scenario has been stood down"
                stationNotInScenario:
                  value:
                    error:
                      code: "E1004"
                      message: "The station is not part of the active scenario"
                notCheckedIn:
                  value:
                    error:
                      code: "E1007"
                      message: "The steward is not checked in at the station"
                clientMessageIdReused:
                  value:
                    error:
                      code: "E0007"
                      message: "The request conflicts with the current state of the resource"

components:
  parameters:
    Station:
      name: station
      in: path
      required: true
      description: The station, the same value as station in a position report, URL-encoded.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: >
                Error code per the hub's scheme:
                https://github.com/aau-cph-sw5/semester-docs/blob/main/docs/06-error-codes.md
              example: "E0001"
            message:
              type: string
              description: For a developer reading a log. Never shown to a user.
