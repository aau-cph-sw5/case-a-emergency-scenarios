openapi: 3.1.0

info:
  title: Emergency Scenario State API
  version: 5.2.0
  description: >
    Shared scenario-state contract used by the control-room
    and steward clients.

servers:
  - url: http://localhost:4010

paths:
  /api/v1/scenario-state:
    get:
      summary: Get current scenario state
      description: >
        Returns the active activation, the same one GET /api/v1/activations
        lists as ACTIVE. Answers 404 while no scenario is active.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current scenario state
          content:
            application/json:
              schema:
                $ref: "./scenario-state.schema.json"
        "404":
          description: No scenario is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0004"
                  message: "No scenario is active"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/scenarios:
    get:
      summary: Get all scenarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./scenario.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/scenarios/{scenarioId}:
    get:
      summary: Get a single scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "./scenario.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "404":
          description: Scenario not found

  /api/v1/metro-lines/{lineId}:
    get:
      summary: Get metro line by ID
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metro line details
          content:
            application/json:
              schema:
                $ref: "./metro-line.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "404":
          description: Metro line not found

  /api/v1/position-reports:
    post:
      summary: Report a steward position
      description: >
        Requires a bearer token with the STEWARD role. The reported station
        must require manning in an active scenario. The staff and
        reportedAt fields are required by the schema but replaced by the
        server: staff by the userId from the token, reportedAt by the time
        the server accepted the report. An accepted report is forwarded to
        connected operators as the position-report Socket.IO event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./position-report.schema.json"
            example:
              staff: "steward-002"
              station: "Station B"
              reportedAt: "2026-09-23T08:10:00Z"

      responses:
        "202":
          description: Position report accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                properties:
                  accepted:
                    type: boolean
              example:
                accepted: true
        "400":
          description: Request body does not match the position-report contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0006"
                  message: "Request body does not match contract schema"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "403":
          description: The signed-in role may not report a position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0002"
                  message: "The authenticated user's role does not permit this action"
        "409":
          description: >
            No scenario is active (E1001), or the station does not require
            manning in an active scenario (E1004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noActiveScenario:
                  value:
                    error:
                      code: "E1001"
                      message: "No scenario is currently active"
                stationNotInScenario:
                  value:
                    error:
                      code: "E1004"
                      message: "The station is not part of the active scenario"

  /api/v1/auth/login:
    post:
      summary: Sign in and receive a role-bound token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./login-request.schema.json"
            example:
              username: "steward-test"
              password: "steward-test-pw"
              expectedRole: "STEWARD"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "./login-response.schema.json"
        "400":
          description: Request body does not match the login-request contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0006"
                  message: "Request body does not match contract schema"
        "401":
          description: Invalid credentials or account role for this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0102"
                  message: "Invalid credentials"

  /api/v1/auth/renew:
    post:
      summary: Replace a valid session with a renewed token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session renewed
          content:
            application/json:
              schema:
                $ref: "./login-response.schema.json"
        "204":
          description: Session remains valid but is not due for renewal
        "401":
          description: Missing, invalid, replaced or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/me:
    get:
      summary: Get the signed-in user's identity and role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "./me.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/auth/logout:
    post:
      summary: End the current login session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"

  /api/v1/activations:
    get:
      summary: List activations
      description: >
        Returns the activations in the store. Only one scenario can be
        active at a time, so the list holds at most one ACTIVE entry. Any
        signed-in role may read it.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Only return activations with this status.
          schema:
            type: string
            enum: [ACTIVE, CLOSED]
      responses:
        "200":
          description: The activations, empty when none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./scenario-state.schema.json"
        "400":
          description: >
            status is not ACTIVE or CLOSED, or is given more than once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0005"
                  message: "status must be one of ACTIVE, CLOSED"
                  message: "Invalid or expired token"

  /api/v1/scenarios/{scenarioId}/activate:
    post:
      summary: Activates a scenario with given id
      description: >
        Requires a bearer token with the OPERATOR role ("All in CCR can
        activate a scenario", Metro on MET-A-026). The actor is taken from
        the token, never from the request.
      security:
        - bearerAuth: []
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Activation successful
          content:
            application/json:
              schema:
                $ref: "./scenario-state.schema.json"
        "401":
          description: Missing, invalid or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0001"
                  message: "Invalid or expired token"
        "403":
          description: The signed-in role may not activate a scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0002"
                  message: "Role STEWARD may not activate a scenario"
        "404":
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0004"
                  message: "No scenario with id 'S1' exists"
        "409":
          description: >
            Activation refused because a scenario is already active. Only
            one scenario can be active at a time, and an activation never
            stands down the active one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "E0007"
                  message: "A scenario is already active, so 'S1' cannot be activated"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: >
                Error code per the hub's scheme:
                https://github.com/aau-cph-sw5/semester-docs/blob/main/docs/06-error-codes.md
              example: "E0001"
            message:
              type: string
              description: For a developer reading a log. Never shown to a user.
