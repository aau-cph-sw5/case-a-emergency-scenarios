name: Code quality

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps

      - name: Run ESLint
        run: npm run lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps

      - name: Run Prettier
        run: npm run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps

      - name: Type-check API
        run: npm run typecheck
