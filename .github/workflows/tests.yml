name: Tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs under c8 only to collect raw coverage for the Coverage job.
      # Coverage from unit and integration tests is combined in that job.
      - name: Run unit tests
        run: |
          mkdir -p test-results
          npx c8 --reporter=none --check-coverage=false node --import tsx --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/node-test-summary.mjs --test-reporter-destination=test-results/unit.json \
            "tests/unit/**/*.test.{js,mjs,ts}"

      - name: Save unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: test-results/unit.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Save raw coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-unit
          path: coverage/tmp/
          retention-days: 1
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A throwaway database that exists only for this job. Its credentials are
    # not secrets: it holds nothing but what the migrations and tests create.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metro
          POSTGRES_USER: metro
          POSTGRES_PASSWORD: metro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metro -d metro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The tests connect as metro_app, as the application does, and migrate as
    # the owner. The owner URL is for fixtures and for proving what metro_app
    # is refused.
    env:
      TEST_DATABASE_URL: postgresql://metro_app:metro_app@localhost:5432/metro
      TEST_OWNER_DATABASE_URL: postgresql://metro:metro@localhost:5432/metro
      JWT_SECRET: test-only-jwt-secret-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same file the local Docker databases run on first start.
      - name: Create the application role
        run: psql "$TEST_OWNER_DATABASE_URL" --file docker/db-init/01-app-role.sql

      - name: Apply database migrations
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/src/db/migrations:/flyway/sql:ro" \
            flyway/flyway:13.9.0 \
            -url=jdbc:postgresql://localhost:5432/metro \
            -user=metro \
            -password=metro \
            -locations=filesystem:/flyway/sql \
            -validateMigrationNaming=true \
            migrate

      # See the comment on the unit test step.
      - name: Run integration tests
        run: |
          mkdir -p test-results
          npx c8 --reporter=none --check-coverage=false node --env-file-if-exists=.env --import tsx --import ./tests/integration/setup-env.ts --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/node-test-summary.mjs --test-reporter-destination=test-results/integration.json \
            "tests/integration/**/*.test.{js,mjs,ts}"

      - name: Save integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: test-results/integration.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Save raw coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-integration
          path: coverage/tmp/
          retention-days: 1
          if-no-files-found: ignore

  jest:
    name: Jest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: |
          mkdir -p test-results
          npm run test:jest -- --coverage --json --outputFile=test-results/jest.json

      - name: Save Jest test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jest
          path: test-results/jest.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Save Jest coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jest
          path: coverage/jest/coverage-final.json
          retention-days: 1
          if-no-files-found: ignore

  coverage:
    name: Backend coverage
    needs: [unit, integration, jest]
    # Runs even when a test fails, so the PR comment always shows coverage. The
    # threshold is only checked when all three test jobs passed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download raw coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-raw-*
          path: coverage/tmp
          merge-multiple: true

      # Merges the raw coverage of both test jobs and writes the reports,
      # including coverage/coverage-summary.json. Always runs, so the PR comment
      # shows numbers even when a test failed.
      - name: Report coverage
        if: ${{ hashFiles('coverage/tmp/*.json') != '' }}
        run: npx c8 report --check-coverage=false

      - name: Download Jest coverage
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          name: coverage-jest
          path: coverage/jest

      # PRs and merge queues compare their tested merge commit with the event base.
      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          node scripts/coverage-report.mjs > coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check changed-file coverage
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.unit.result == 'success' && needs.integration.result == 'success' && needs.jest.result == 'success' }}
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/coverage-report.mjs --check

      - name: Create combined coverage for SonarQube
        if: ${{ !cancelled() && hashFiles('coverage/coverage-final.json') != '' && hashFiles('coverage/jest/coverage-final.json') != '' }}
        run: node scripts/coverage-report.mjs --write-lcov

      - name: Save coverage for SonarQube
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: ignore

      - name: Comment on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/report.md') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- coverage-report -->";
            const body = fs.readFileSync("coverage/report.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user.login === "github-actions[bot]" && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  test-results:
    name: Test results
    needs: [unit, integration, jest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Write test summary
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          JEST_RESULT: ${{ needs.jest.result }}
        run: |
          mkdir -p test-results
          node scripts/test-results-report.mjs > test-results/report.md
          cat test-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- test-results-report -->";
            const body = fs.readFileSync("test-results/report.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.login === "github-actions[bot]" && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  sonarqube:
    name: SonarQube
    needs: [coverage]
    # Runs even when a test fails, so the analysis still reports on the code.
    # SONAR_TOKEN is not given to workflows from forks or Dependabot, and a
    # merge queue branch is not one SonarQube should track.
    if: >-
      !cancelled() &&
      github.event_name != 'merge_group' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history, so SonarQube can tell new code from old and blame lines.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The analyser resolves each tsconfig.json, and mobile extends one from expo.
      - name: Install dependencies
        run: npm ci

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: coverage
        continue-on-error: true

      - name: Match coverage to the pull request head
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$GITHUB_SHA"
          fi
          node scripts/filter-sonar-coverage.mjs

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Link to SonarQube results
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="https://sonarcloud.io/project/overview?id=aau-cph-sw5_case-a-code-analysis"
          if [ -n "$PR_NUMBER" ]; then url="$url&pullRequest=$PR_NUMBER"; fi
          echo "[View SonarQube analysis]($url)" >> "$GITHUB_STEP_SUMMARY"

      # Settings are in sonar-project.properties. Inline annotations are
      # published by the SonarQube GitHub integration when enabled there.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
