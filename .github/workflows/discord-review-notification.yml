name: Discord Review Notifications

on:
  pull_request_target:
    types: [opened, review_requested, closed]

permissions:
  issues: write
  pull-requests: write
  actions: read

# Serialize runs for the same PR, including re-requests.
concurrency:
  group: discord-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  notify-discord:
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'review_requested' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Manage Discord notifications
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USERS: ${{ vars.DISCORD_USERS }}

        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const number = pr.number;
            const runId = String(context.runId);
            const marker = "<!-- discord-review-state:";
            const batchMs = 30000;

            // =========================================
            // Configuration
            // =========================================

            const webhook = process.env.DISCORD_WEBHOOK;

            if (!webhook) {
              throw new Error("DISCORD_WEBHOOK secret missing");
            }

            if (!process.env.DISCORD_USERS) {
              throw new Error("DISCORD_USERS variable missing");
            }

            const users = Object.fromEntries(
              Object.entries(
                JSON.parse(process.env.DISCORD_USERS)
              ).map(([name, id]) => [
                name.toLowerCase(),
                String(id)
              ])
            );

            // =========================================
            // GitHub tracking storage
            // =========================================

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: number,
                per_page: 100
              }
            );

            let stateComment = comments.find(
              c =>
                c.user?.login === "github-actions[bot]" &&
                c.body?.startsWith(marker)
            );

            let state = {
              version: 3,
              initial: null,
              notifications: [],
              merged: false
            };

            if (stateComment) {
              const line = stateComment.body.split("\n")[0];

              const stored = JSON.parse(
                line.slice(marker.length)
                  .replace(/-->$/, "")
                  .trim()
              );

              if (stored.version === 3) {
                state = stored;
              } else if (stored.version === 2) {
                // Migrate state from the previous workflow.
                state.initial = stored.initial
                  ? {
                      status: stored.initial.messageId
                        ? "sent" : "pending",
                      runId: null,
                      deadline: stored.initial.deadline,
                      reviewers: stored.initial.reviewers || [],
                      messageId: stored.initial.messageId || null
                    }
                  : null;

                state.notifications = (
                  stored.notifications || []
                ).map(n => ({
                  reviewer: n.reviewer,
                  messageId: n.messageId,
                  runId: n.runId
                    ? String(n.runId) : null,
                  status: "sent"
                }));
              } else {
                // Migrate legacy reviewer -> message IDs.
                for (const [reviewer, ids] of Object.entries(stored)) {
                  for (const id of (Array.isArray(ids) ? ids : [ids])) {
                    state.notifications.push({
                      reviewer: reviewer.toLowerCase(),
                      messageId: String(id),
                      runId: null,
                      status: "sent"
                    });
                  }
                }

                state.initial = {
                  status: "sent",
                  runId: null,
                  deadline: 0,
                  reviewers: [],
                  messageId: null
                };
              }
            }

            async function saveState() {
              const body =
                `${marker}${JSON.stringify(state)} -->\n` +
                "Discord notification tracking " +
                "(managed by GitHub Actions).";

              try {
                if (stateComment) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: stateComment.id,
                    body
                  });
                } else {
                  const result =
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: number,
                      body
                    });

                  // Keep the new ID for later updates.
                  stateComment = result.data;
                }
              } catch (error) {
                throw new Error(
                  "Cannot write Discord tracking state. " +
                  "No new Discord message should be sent. " +
                  `GitHub returned ${error.status || "unknown"}: ` +
                  error.message
                );
              }
            }

            // =========================================
            // Discord API
            // =========================================

            async function discordRequest(method, path, data) {
              const url = new URL(webhook);

              url.pathname =
                url.pathname.replace(/\/$/, "") + path;

              if (method === "POST") {
                url.searchParams.set("wait", "true");
              }

              const response = await fetch(url, {
                method,
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
              });

              if (!response.ok) {
                throw new Error(
                  `Discord ${response.status}: ` +
                  await response.text()
                );
              }

              const body = await response.text();
              return body ? JSON.parse(body) : null;
            }

            async function sendMessage(content, ids) {
              const result = await discordRequest(
                "POST",
                "",
                {
                  content,
                  allowed_mentions: {
                    parse: [],
                    users: [...new Set(ids)]
                  }
                }
              );

              if (!result?.id) {
                throw new Error(
                  "Discord did not return a message ID"
                );
              }

              return String(result.id);
            }

            async function getCurrentPr() {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: number
              });

              return response.data;
            }

            // =========================================
            // Determine event time
            // =========================================

            const run = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId
            });

            const eventTime =
              new Date(run.data.created_at).getTime();

            // =========================================
            // First notification: batch reviewers
            // =========================================

            if (
              (action === "opened" ||
               action === "review_requested") &&
              !state.initial &&
              !state.merged
            ) {
              // Reserve this initial notification BEFORE
              // contacting Discord.
              const deadline = eventTime + batchMs;

              state.initial = {
                status: "pending",
                runId,
                deadline,
                reviewers: [],
                messageId: null
              };

              // Permission check: must successfully
              // write tracking state before posting.
              await saveState();

              const remaining = deadline - Date.now();

              if (remaining > 0) {
                await new Promise(resolve =>
                  setTimeout(resolve, remaining)
                );
              }

              const currentPr = await getCurrentPr();

              if (currentPr.state !== "open") {
                console.log("PR is closed. No ping sent.");
                return;
              }

              const response =
                await github.rest.pulls.listRequestedReviewers({
                  owner,
                  repo,
                  pull_number: number
                });

              const reviewers = [
                ...new Set(
                  response.data.users
                    .map(u => u.login.toLowerCase())
                    .filter(name => users[name])
                )
              ];

              state.initial.reviewers = reviewers;

              if (reviewers.length === 0) {
                state.initial.status = "sent";
                await saveState();

                console.log("No mapped reviewers in batch.");
                return;
              }

              const ids = [
                ...new Set(reviewers.map(name => users[name]))
              ];

              const mentions =
                ids.map(id => `<@${id}>`).join(" ");

              // Persist the reviewer list before sending.
              await saveState();

              const content =
                `🔔 **Review Requested**\n\n` +
                `${mentions}\n\n` +
                `You have been requested to review:\n` +
                `**PR #${number} — ${pr.title}**\n` +
                `🔗 ${pr.html_url}`;

              // A reserved pending state prevents
              // another run from reposting this batch.
              const messageId = await sendMessage(
                content,
                ids
              );

              state.initial.messageId = messageId;
              state.initial.status = "sent";

              await saveState();

              console.log(
                `Initial notification saved: ${messageId}`
              );

              return;
            }

            // =========================================
            // Later requests and re-requests
            // =========================================

            if (action === "review_requested") {
              const reviewer =
                context.payload.requested_reviewer?.login;

              // Team requests are not individual mentions.
              if (!reviewer) {
                console.log("Team request ignored.");
                return;
              }

              const username = reviewer.toLowerCase();
              const discordId = users[username];

              if (!discordId) {
                console.log("Reviewer has no Discord mapping.");
                return;
              }

              // Never create notifications after merge.
              const currentPr = await getCurrentPr();

              if (currentPr.state !== "open" || state.merged) {
                console.log("PR is closed.");
                return;
              }

              // If the initial batch is unfinished, do not
              // create independent pings for those events.
              if (state.initial?.status === "pending") {
                console.log(
                  "Initial notification pending; skipping."
                );
                return;
              }

              const includedInInitial =
                state.initial?.reviewers?.includes(username) ||
                false;

              // Skip events already covered by the batch.
              if (
                includedInInitial &&
                eventTime <= state.initial.deadline
              ) {
                console.log(
                  "Reviewer was included in initial batch."
                );
                return;
              }

              // Prevent repeat execution of the same run.
              const alreadyRecorded =
                state.notifications.some(
                  n => n.runId === runId
                );

              if (alreadyRecorded) {
                console.log(
                  "Workflow event already recorded."
                );
                return;
              }

              const previouslyNotified =
                includedInInitial ||
                state.notifications.some(
                  n => n.reviewer === username
                );

              const heading = previouslyNotified
                ? "🔄 **Review Re-requested**"
                : "🔔 **New Reviewer Requested**";

              const content =
                `${heading}\n\n` +
                `<@${discordId}> Your review is needed!\n\n` +
                `**PR #${number} — ${pr.title}**\n` +
                `🔗 ${pr.html_url}`;

              // Reserve event before contacting Discord.
              const notification = {
                reviewer: username,
                runId,
                status: "pending",
                messageId: null
              };

              state.notifications.push(notification);

              // If this fails, there is no Discord ping.
              await saveState();

              const messageId = await sendMessage(
                content,
                [discordId]
              );

              notification.messageId = messageId;
              notification.status = "sent";

              await saveState();

              console.log(
                `Reviewer notification saved: ${messageId}`
              );

              return;
            }

            // =========================================
            // Pull request merged
            // =========================================

            if (action === "closed" && pr.merged === true) {
              // Record merge state before editing Discord.
              state.merged = true;

              await saveState();

              const ids = [
                state.initial?.messageId,
                ...state.notifications.map(n => n.messageId)
              ].filter(Boolean);

              const uniqueIds = [...new Set(ids)];

              const content =
                `✅ **Pull Request Merged**\n\n` +
                `**PR #${number} — ${pr.title}**\n` +
                `🔗 ${pr.html_url}\n\n` +
                `Review no longer required.`;

              let failures = 0;

              for (const messageId of uniqueIds) {
                try {
                  await discordRequest(
                    "PATCH",
                    `/messages/${messageId}`,
                    {
                      content,
                      allowed_mentions: {
                        parse: []
                      }
                    }
                  );

                  console.log(
                    `Updated Discord message ${messageId}`
                  );
                } catch (error) {
                  failures++;

                  console.error(
                    `Failed to update ${messageId}: ` +
                    error.message
                  );
                }
              }

              if (failures > 0) {
                throw new Error(
                  `${failures} Discord updates failed.`
                );
              }

              console.log(
                `Merge completed: ${uniqueIds.length} messages updated.`
              );
            }
