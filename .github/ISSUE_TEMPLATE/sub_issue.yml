name: Sub-issue / Task
description: Opret en mindre opgave under et eksisterende PBI (en delopgave, ikke et selvstændigt backlog-item)
title: "Sub-issue of: "
labels: ["case:A"]
body:
  - type: markdown
    attributes:
      value: |
        Guidelines: (https://github.com/aau-cph-sw5/case-a-emergency-scenarios/blob/main/issue-workflow.md)
        Eksempel på godt navn: Sub-issue of MEM-A-001
  - type: textarea
    id: done-when
    attributes:
      label: Færdig når
      description: Én eller flere konkrete betingelser for at lukke opgaven.
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options: [frontend, backend, mobile, cross-team, other]
    validations:
      required: true
