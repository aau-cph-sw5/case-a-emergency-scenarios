name: Sub-issue / Task
description: Opret en mindre opgave under et eksisterende PBI (en delopgave, ikke et selvstændigt backlog-item)
title: "Sub-issue of: "
labels: ["case:A"]
body:
  - type: markdown
    attributes:
      value: |
        Eksempel på godt navn: Sub-issue of MEM-A-001
  - type: input
    id: sub-issue-of
    attributes:
      label: Sub-issue of
      description: Reference til det overordnede PBI.
      placeholder: "#42"
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Færdig når
      description: Én eller flere konkrete betingelser for at lukke opgaven.
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options: [frontend, backend, mobile, cross-team, other]
    validations:
      required: true
