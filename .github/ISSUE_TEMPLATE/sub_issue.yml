name: Sub-issue / Task
description: Opret en mindre opgave under et eksisterende PBI (en delopgave, ikke et selvstændigt backlog-item)
title: "Sub-issue of "
labels: ["case:A"]
body:
  - type: markdown
    attributes:
      value: |
        [Issue Guidelines](https://github.com/aau-cph-sw5/case-a-emergency-scenarios/blob/main/issue-workflow.md), før du opretter en sub-issue.
        Husk at vælge sprint under **Milestone** nederst i formularen.
  - type: textarea
    id: done-when
    attributes:
      label: Beskrivelse
      description: Kort kontekst og én eller flere konkrete betingelser for at lukke opgaven. Kryds punkterne af, efterhånden som de er opfyldt.
      value: |
        ## Context

        ## Acceptance criteria
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options: [frontend, backend, mobile, cross-team, other]
    validations:
      required: true
