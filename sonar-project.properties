sonar.organization=aau-cph-sw5
sonar.projectKey=aau-cph-sw5_case-a-code-analysis

# SonarQube Cloud analyses the whole repository and ignores sonar.sources and
# sonar.tests, so scope is set with patterns. Test patterns are also excluded
# from the source code.
sonar.test.inclusions=tests/**
# Generated from the JSON Schemas in contracts/; analysed at the source instead.
# Images are binary and not code.
sonar.exclusions=shared/types/v1/**,**/*.png

# The Tests workflow merges unit and integration coverage of the backend into
# this file. Only src/ is measured (see .c8rc.json), so everything else is left
# out of the coverage metric instead of counting as 0%.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=shared/**,web/**,mobile/**,scripts/**,stub-server/**,*.js,*.cjs
